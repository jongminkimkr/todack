<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토닥+ 브라우저 진단</title>
<style>
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
       font-size:15px; line-height:1.6; margin:0; padding:20px 18px 48px;
       background:#F4FBF7; color:#16261E; -webkit-text-size-adjust:100%}
  h1{font-size:19px; margin:0 0 4px}
  p.lead{margin:0 0 18px; font-size:13px; color:#5C7268}
  h2{font-size:14px; margin:22px 0 8px; color:#1F7A4D}
  ul{list-style:none; margin:0; padding:0}
  li{display:flex; gap:8px; align-items:flex-start; padding:7px 10px; border-radius:9px;
     background:#fff; border:1px solid #DCEAE2; margin-bottom:5px; font-size:13.5px}
  li .m{flex:none; font-weight:800; width:22px}
  .ok  .m{color:#2FA36B}
  .no  .m{color:#C0553F}
  .no{background:#FCEEEA; border-color:#EFC9BE}
  .sum{margin:20px 0 0; padding:15px 16px; border-radius:14px; font-size:14px; font-weight:700}
  .sum.good{background:#E6F5EC; color:#1F7A4D}
  .sum.bad{background:#FCEEEA; color:#C0553F}
  pre{white-space:pre-wrap; word-break:break-all; font-size:11px; color:#5C7268;
      background:#fff; border:1px solid #DCEAE2; border-radius:9px; padding:10px; margin:8px 0 0}
</style>
</head>
<body>

<h1>토닥+ 브라우저 진단</h1>
<p class="lead">토닥+가 이 브라우저에서 동작하는 데 필요한 기능을 확인합니다.<br>
결과 화면을 그대로 캡처해 알려 주세요.</p>

<div id="out">확인 중…</div>

<script>
/* 진단 도구 자체는 어떤 환경에서도 돌아야 하므로 ES5 문법만 사용한다. */
(function () {
  var required = [];   // 하나라도 없으면 앱이 뜨지 않는 것들
  var optional = [];   // 없으면 모양만 아쉬운 것들

  function syntax(code) {
    try { new Function(code); return true; } catch (e) { return false; }
  }
  function req(name, pass, note) { required.push({ n: name, p: !!pass, note: note || '' }); }
  function opt(name, pass, note) { optional.push({ n: name, p: !!pass, note: note || '' }); }

  /* --- 앱이 실제로 쓰는 문법 --- */
  req('화살표 함수·템플릿 문자열', syntax('var f=(a)=>`x${a}`'));
  req('구조 분해·기본값',          syntax('function f({a=1}={}){return a}'));
  req('전개 연산자 (객체)',        syntax('var o={...{a:1}}'));
  req('catch 바인딩 생략',         syntax('try{}catch{}'), 'Safari 11.1 이상');
  req('널 병합 ??',                syntax('var a=null??1'),  'Safari 13.1 이상');
  req('Object.fromEntries',        typeof Object.fromEntries === 'function', 'Safari 12.1 이상');
  req('Array.includes / findIndex', [].includes && [].findIndex);
  req('String.padStart',           ''.padStart);
  req('Set / Map',                 typeof Set === 'function' && typeof Map === 'function');
  req('matchMedia',                typeof window.matchMedia === 'function');
  req('requestAnimationFrame',     typeof window.requestAnimationFrame === 'function');
  req('performance.now',           window.performance && typeof performance.now === 'function');
  req('classList.toggle(2번째 인자)', (function () {
    try { var d = document.createElement('div'); d.classList.toggle('x', true); return d.classList.contains('x'); }
    catch (e) { return false; }
  })());

  /* --- 저장소 --- */
  var storageMsg = '';
  var storageOK = (function () {
    try { localStorage.setItem('todak.probe', '1'); localStorage.removeItem('todak.probe'); return true; }
    catch (e) { storageMsg = String(e && e.name ? e.name : e); return false; }
  })();
  req('localStorage 저장', storageOK,
      storageOK ? '' : (storageMsg + ' — 기록이 저장되지 않습니다'));

  /* --- 있으면 좋은 것 --- */
  opt('Element.animate (등장 애니메이션)', typeof document.createElement('div').animate === 'function', 'Safari 13.1 이상');
  opt('서비스워커 (오프라인)', 'serviceWorker' in navigator,
      location.protocol.indexOf('http') === 0 ? '' : 'file://에서는 원래 동작하지 않습니다');
  var sup = (window.CSS && CSS.supports) ? function (a, b) { try { return CSS.supports(a, b); } catch (e) { return false; } }
                                         : function () { return false; };
  opt('CSS aspect-ratio (달력 정사각형)', sup('aspect-ratio', '1'));
  opt('CSS color-mix (감정 색 배경)',      sup('color', 'color-mix(in srgb, red 50%, blue)'));
  opt('CSS @property (완료 카드 테두리)',  !!(window.CSS && CSS.registerProperty));
  opt('backdrop-filter (탭바 흐림)',       sup('-webkit-backdrop-filter', 'blur(2px)') || sup('backdrop-filter', 'blur(2px)'));

  /* --- 출력 --- */
  function list(items) {
    var h = '<ul>';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<li class="' + (it.p ? 'ok' : 'no') + '"><span class="m">' + (it.p ? '○' : '✕') + '</span>' +
           '<span>' + it.n + (it.note ? '<br><span style="font-size:11.5px;opacity:.75">' + it.note + '</span>' : '') +
           '</span></li>';
    }
    return h + '</ul>';
  }
  var failed = [];
  for (var i = 0; i < required.length; i++) if (!required[i].p) failed.push(required[i].n);

  var html = '';
  html += '<h2>앱 실행에 반드시 필요한 것</h2>' + list(required);
  html += '<h2>없어도 되지만 있으면 좋은 것</h2>' + list(optional);
  html += failed.length
    ? '<p class="sum bad">✕ ' + failed.length + '개가 지원되지 않습니다.<br>' +
      failed.join(', ') + '<br><br>이 브라우저에서는 토닥+가 뜨지 않습니다. 다른 브라우저로 열어 보세요.</p>'
    : '<p class="sum good">○ 앱 실행에 필요한 기능은 모두 지원됩니다.' +
      (storageOK ? '' : '<br>다만 기록은 저장되지 않습니다.') + '</p>';
  html += '<h2>브라우저 정보</h2><pre>' +
          String(navigator.userAgent).replace(/&/g, '&amp;').replace(/</g, '&lt;') +
          '\n\n프로토콜: ' + location.protocol +
          '\n화면: ' + (window.innerWidth || '?') + ' x ' + (window.innerHeight || '?') +
          ' (devicePixelRatio ' + (window.devicePixelRatio || '?') + ')' + '</pre>';

  document.getElementById('out').innerHTML = html;
})();
</script>
</body>
</html>
